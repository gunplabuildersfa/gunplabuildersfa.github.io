maniacs<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nos liens</title>

  <!-- Icônes des réseaux sociaux -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --fond: #f7f5f2;
      --texte: #292929;
      --bouton: #ffffff;
      --accent: #7653a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px;
      display: grid;
      place-items: center;
      background: var(--fond);
      color: var(--texte);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 440px);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(80%, 280px);
      max-height: 180px;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .lien {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 54px;
      margin: 12px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--bouton);
      color: var(--texte);
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 3px 12px #00000012;
      transition: transform 0.15s, background 0.15s;
    }

    .lien:hover {
      transform: translateY(-2px);
      background: #eee8f5;
    }

    .lien i {
      color: var(--accent);
      font-size: 1.2rem;
    }

    h2 {
      margin: 34px 0 14px;
      font-size: 1.25rem;
    }
  </style>
</head>

<body>
  <main>
    <!-- Téléversez votre logo dans le dépôt sous le nom logo.png -->
    <img class="logo" src="Logo GBFA.png" alt="Gunpla Builders French Association">

    <!-- Remplacez les URL par celles de vos pages -->
    <a class="lien" href="https://www.instagram.com/gunplabuilders_frenchasso/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      Instagram
    </a>

    <a class="lien" href="https://www.facebook.com/p/Gunpla-Builders-French-Association-61573849230987/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-facebook" aria-hidden="true"></i>
      Facebook
    </a>

    <a class="lien" href="https://VOTRE-SITE.fr" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-globe" aria-hidden="true"></i>
      Notre site internet
    </a>

    <a class="lien" href="mailto:gunplabuildersfa@gmail.com">
      <i class="fa-solid fa-envelope" aria-hidden="true"></i>
      Nous contacter
    </a>

    <h2>Notre partenaire</h2>
    
    <!-- Téléversez votre logo dans le dépôt sous le nom logo.png -->
    <img class="logo" src="Logo Mecamaniacs.jpg" alt="Mecamaniacs">
    
    <a class="lien" href="https://www.instagram.com/mecha.maniacs33/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      Instagram
    </a>
  </main>
</body>
</html>
